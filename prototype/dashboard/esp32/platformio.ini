; PROTOTYPE — throwaway (issue #7). The ESP32-S3 half of the dashboard prototype:
; an access point serving the same dashboard page the laptop prototype serves,
; with the fake drive generated on the board and pushed over SSE.
;
;   cd prototype/dashboard/esp32
;   node tools/embed.mjs          # page files -> src/web_assets.h (stamps build time)
;   SSL_CERT_FILE=/etc/ssl/cert.pem ~/.platformio/penv/bin/pio run -t upload -t monitor
;
; Two non-obvious bits:
;   version.txt        ESP-IDF asks git for PROJECT_VER, and this repo has no
;                      commits at all, which fails configure. version.txt wins first.
;   SSL_CERT_FILE      PlatformIO's bundled Python has no CA store, so package
;                      installs fail TLS without it.
;
; Flash size is pinned to 2 MB / 1 MB app on purpose: every ESP32-S3 module has at
; least 2 MB, and the extra flash on an N4/N8/N16 board is simply unused. Size the
; partition table properly once the board is known and the record store exists.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

board_upload.flash_size = 4MB
board_build.flash_mode = dio

build_flags =
    -DAPP_HZ=10

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
